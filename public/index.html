<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    [hidden] { display: none !important; }
    .auth-panel { margin: 24px 0; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth-panel h2 { margin-top: 0; }
    label { display: block; margin: 12px 0 6px; }
    input, button { font: inherit; box-sizing: border-box; border-radius: 8px; padding: 11px 12px; }
    input { width: 100%; border: 1px solid #8da1b8; background: #101a28; color: #ecf4ff; }
    button { margin-top: 16px; border: 0; background: #8ad8df; color: #101a28; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .error { color: #ffd4dc; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 2단계 서버 자료실</div>
    <h1>점령된 자료실</h1>
    <p>가상 메모를 공개 파일에서 DB로 옮겼습니다. 아래 기록은 서버 API를 통해 가져오는 실습 자료입니다.</p>
    <div class="notice">아직 서버 API에는 로그인 제한이 없어 누구나 가상 메모를 조회할 수 있습니다. 접근 제한은 다음 단계에서 추가합니다. 실제 개인정보는 넣지 마세요.</div>
    <section class="auth-panel" aria-labelledby="auth-heading">
      <h2 id="auth-heading">자료실 로그인</h2>
      <p id="auth-status" role="status">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" hidden>
        <label for="login-email">이메일</label>
        <input id="login-email" type="email" autocomplete="username" required placeholder="learner-a@example.com">
        <label for="login-password">비밀번호</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit" disabled>로그인</button>
      </form>
      <button id="logout-button" type="button" hidden disabled>로그아웃</button>
      <p id="auth-error" class="error" role="alert"></p>
      <p>3단계 제작 1: 로그인·로그아웃 화면을 연결했습니다. 서버 API의 비로그인 차단은 다음 제작에서 적용합니다.</p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    const list = document.querySelector('#notes');
    try {
      const response = await fetch('/api/notes', { cache: 'no-store' });
      if (!response.ok) throw new Error('서버 자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
      const data = await response.json();
      if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
      list.replaceChildren(...data.notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');
        title.textContent = note.title;
        content.textContent = note.content;
        item.append(title, content);
        return item;
      }));
    } catch (error) {
      const item = document.createElement('li');
      item.textContent = '서버 자료를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';
      list.replaceChildren(item);
    }
  </script>
  <script src="/vendor/supabase.js" defer></script>
  <script src="/auth-ui.js" defer></script>
</body>
</html>
